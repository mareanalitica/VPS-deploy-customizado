networks:
  public_net:
    external: true
  internal_net:
    external: true

secrets:
  api_nestjs_db_password:
    external: true
    name: ${API_NESTJS_DB_PASSWORD_SECRET:-api_nestjs_db_password_v1}
  api_nestjs_rabbitmq_password:
    external: true
    name: ${API_NESTJS_RABBITMQ_PASSWORD_SECRET:-api_nestjs_rabbitmq_password_v1}
  redis_password:
    external: true
    name: ${REDIS_PASSWORD_SECRET:-redis_password_v1}
