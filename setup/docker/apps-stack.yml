  #   deploy:
  #     labels:
  #       - "traefik.enable=true"
  #       - "traefik.http.routers.payment-service.rule=Host(`pay.${DOMAIN_NAME:-localhost}`)"
  #       - "traefik.http.routers.payment-service.entrypoints=websecure"
