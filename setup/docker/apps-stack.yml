version: '3.8'

# =============================================================================
# Stack das aplicacoes do cliente (api-nestjs, web-vite).
# Deploy separado da infra base ("infra") - atualizar a app nao mexe em
# Traefik/Jenkins/bancos, e vice-versa.
# Requer a stack "infra" ja implantada (usa public_net/internal_net e os
# bancos/roles dedicados criados por setup/scripts/bootstrap-app-databases.sh).
# =============================================================================

services:
  api-nestjs:
    image: ${API_NESTJS_IMAGE:-api-nestjs:latest}
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_HOST: postvector
      POSTGRES_PORT: 5432
      POSTGRES_USER: api_nestjs_app
      POSTGRES_PASSWORD_FILE: /run/secrets/api_nestjs_db_password
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_VHOST: api_nestjs_vhost
      RABBITMQ_USER: api_nestjs_app
    secrets:
      - api_nestjs_db_password
      - redis_password
      - api_nestjs_rabbitmq_password
    networks:
      - public_net
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: ${API_NESTJS_REPLICAS:-1}
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api-nestjs.rule=Host(`api.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.api-nestjs.entrypoints=websecure"
        - "traefik.http.routers.api-nestjs.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.api-nestjs.loadbalancer.server.port=3000"
      resources:
        limits:
          memory: 256M

  web-vite:
    image: ${WEB_VITE_IMAGE:-web-vite:latest}
    networks:
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: ${WEB_VITE_REPLICAS:-1}
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.web-vite.rule=Host(`${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.web-vite.entrypoints=websecure"
        - "traefik.http.routers.web-vite.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.web-vite.loadbalancer.server.port=80"
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # RESERVADO - api-nestjs-payment-service ainda nao tem codigo implementado
