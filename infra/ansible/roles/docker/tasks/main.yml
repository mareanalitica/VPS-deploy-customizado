---
# Substitui o antigo "curl -fsSL https://get.docker.com | sh" do init.sh por
# instalacao via repositorio apt oficial com chave GPG verificada - fecha o
# achado de seguranca de "supply chain: script remoto sem verificacao".

- name: Instalar dependencias para repositorios apt de terceiros
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Garantir /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave GPG oficial do Docker
  ansible.builtin.get_url:
    # Docker mantem repositorios apt SEPARADOS para Ubuntu e Debian (mesma
    # familia de distro, pacotes/URLs diferentes) - "ansible_distribution"
    # (fact do Ansible) reporta "Debian" ou "Ubuntu" e escolhe a URL certa.
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adicionar repositorio apt oficial do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch_map[ansible_architecture] }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Instalar Docker Engine + plugin compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Garantir servico Docker habilitado e ativo
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Configurar DNS explicito no daemon Docker
  # Sem isso, containers criados por "docker build" (RUN steps) podem herdar
  # uma config de DNS do host que nao funciona de dentro do namespace de
  # rede isolado do container - tipico quando o host usa systemd-resolved
  # (resolv.conf apontando pra 127.0.0.53, so alcancavel no host, nao de
  # dentro de um container). Sintoma visto na pratica: "docker build" falha
  # com "Temporary failure in name resolution" mesmo com o HOST resolvendo
  # DNS normalmente (apt/curl no host nao passam por esse namespace isolado).
  # Overwrite direto e' seguro aqui - Docker acabou de ser instalado por
  # esta mesma role, sem daemon.json customizado preexistente.
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "dns": ["8.8.8.8", "1.1.1.1"]
      }
    mode: "0644"
  register: docker_daemon_json

- name: Reiniciar Docker para aplicar o DNS novo
  # Restart direto (nao "notify"/handler) de proposito - precisa ter efeito
  # ANTES da role "stack_deploy" rodar (mesma play, mais adiante), nao so'
  # no fim da play inteira como um handler normal faria.
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_daemon_json.changed

- name: Baixar chave GPG oficial do NodeSource
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Adicionar repositorio apt oficial do NodeSource
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main
    state: present
    filename: nodesource

- name: Instalar Node.js (necessario para setup/scripts/manage-env.js)
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Instalar Docker SDK for Python (necessario pelos modulos community.docker.* NA VPS)
  # Os modulos community.docker.* rodam remotamente e falam com a API do
  # Docker via essa lib Python - precisa estar instalada no host alvo, nao
  # so' no control node. Via apt (nao pip) pra nao esbarrar na mesma
  # protecao PEP 668 que jah vimos no control node.
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true

- name: Inicializar Docker Swarm (idempotente - nao faz nada se ja ativo)
  community.docker.docker_swarm:
    state: present

- name: Criar rede overlay 'public_net'
  community.docker.docker_network:
    name: public_net
    driver: overlay
    state: present
