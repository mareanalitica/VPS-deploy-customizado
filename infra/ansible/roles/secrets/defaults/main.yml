---
# Stacks opcionais - default "0" (desligado) pra nao afetar clientes que so
# querem a infra base. Sobrescreva em host_vars/<client_name>.yml pro
# cliente que precisa deles.
deploy_apps_stack: "0"
deploy_evocrm_stack: "0"
deploy_evogo_stack: "0"

# So relevantes quando os toggles acima estao "1" - defaults sao placeholders
# obviamente errados de proposito, pra forcar host_vars a definir o real.
crm_web_domain: "crm.{{ domain_name | default('localhost') }}"
crm_api_domain: "crmapi.{{ domain_name | default('localhost') }}"
evogo_domain: "evogo.{{ domain_name | default('localhost') }}"
