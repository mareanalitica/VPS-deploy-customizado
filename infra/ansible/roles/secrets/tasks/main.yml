---
- name: Gerar/atualizar .env (senhas aleatorias para chaves vazias)
  ansible.builtin.command:
    cmd: node setup/scripts/manage-env.js
    chdir: "{{ deploy_root }}"
  register: manage_env_result
  changed_when: "'geradas com sucesso' in manage_env_result.stdout"
  # Sem failed_when customizado de proposito: se o script sair com rc != 0
  # (ex: ".env" ausente mas ha backups anteriores - ver manage-env.js), isso
  # exige uma decisao humana (restaurar backup vs "--force") e o playbook
  # DEVE parar aqui, nao seguir silenciosamente.

- name: Ajustar valores nao-secretos especificos deste cliente no .env
  ansible.builtin.lineinfile:
    path: "{{ deploy_root }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "CLIENT_NAME", value: "{{ client_name }}" }
    - { key: "DOMAIN_NAME", value: "{{ domain_name }}" }
    - { key: "TRAEFIK_ACME_EMAIL", value: "{{ traefik_acme_email }}" }
    - { key: "ADMIN_ALLOWED_CIDRS", value: "{{ admin_allowed_cidrs }}" }
    - { key: "DEPLOY_APPS_STACK", value: "{{ deploy_apps_stack }}" }
    - { key: "DEPLOY_EVOCRM_STACK", value: "{{ deploy_evocrm_stack }}" }
    - { key: "DEPLOY_EVOGO_STACK", value: "{{ deploy_evogo_stack }}" }
    - { key: "CRM_WEB_DOMAIN", value: "{{ crm_web_domain }}" }
    - { key: "CRM_API_DOMAIN", value: "{{ crm_api_domain }}" }
    - { key: "EVOGO_DOMAIN", value: "{{ evogo_domain }}" }
  loop_control:
    label: "{{ item.key }}"
